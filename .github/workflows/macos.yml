name: macOS
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Tests (core, CLI, FFI)
        run: cargo test -p yiime-core -p yiime-cli -p yiime-ffi
      - name: Build YiIME.app and .pkg
        run: bash macos/build.sh 0.1.0
      # Experimental: macOS 26 runners do not allow enabling an unsigned input method yet.
      - name: End-to-end GUI test (install, select input source, type in TextEdit)
        continue-on-error: true
        run: bash macos/e2e/run.sh 0.1.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-e2e
          path: dist/macos-e2e/
      - uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: dist/YiIME-*-macos.pkg
