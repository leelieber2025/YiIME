name: Release build
# Builds the release files for a version tag (or on demand) and uploads them as workflow
# artifacts; publishing the GitHub release stays a manual step (see RELEASING.md: a release
# candidate vX.Y.Z-rc.N first, then the stable vX.Y.Z). Code signing is opt-in: every signing
# step is skipped cleanly when its secrets are not configured, so forks and unsigned builds keep
# working. See SIGNING.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-binaries:
    runs-on: ubuntu-latest
    env:
      # Authenticode certificate (PFX, base64) and its password; optional.
      WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
      WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          targets: x86_64-pc-windows-gnu
      - name: Install MinGW and osslsigncode
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 osslsigncode
      # Signs the EXE and the TSF DLL before packaging when the certificate is configured.
      - name: Build, sign (optional) and package
        run: bash windows/build.sh
      - name: Check signatures
        if: env.WINDOWS_SIGN_PFX_BASE64 != ''
        run: |
          for file in dist/YiIME.exe dist/yiime_tsf.dll; do
              osslsigncode extract-signature -in "$file" -out /dev/null || { echo "$file 未签名" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist/

  windows-installer:
    needs: windows-binaries
    runs-on: windows-latest
    env:
      WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
      WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      # With a certificate, ISCC signs both the setup and the uninstaller inside it.
      - name: Prepare signing
        if: env.WINDOWS_SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'yiime-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGN_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          # Inno Setup sign command: $q is a quote, $f the file to sign.
          "ISCC_SIGNTOOL=`$q$signtool`$q sign /fd SHA256 /f `$q$pfx`$q /p `$q$env:WINDOWS_SIGN_PFX_PASSWORD`$q /tr http://timestamp.digicert.com /td SHA256 /d YiIME `$f" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGNTOOL=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build installer
        shell: bash
        env:
          ISCC: C:\Program Files (x86)\Inno Setup 6\ISCC.exe
        run: bash windows/build-installer.sh
      - name: Verify installer signature
        if: env.WINDOWS_SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          & $env:SIGNTOOL verify /pa (Get-ChildItem dist\YiIME-*-setup.exe).FullName
          if ($LASTEXITCODE -ne 0) { throw 'installer signature invalid' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/YiIME-*-setup.exe

  macos:
    runs-on: macos-latest
    env:
      # Developer ID Application + Developer ID Installer certificates (one .p12, base64) and its
      # password; notarization credentials. All optional.
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Import signing certificates
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: |
          keychain="$RUNNER_TEMP/yiime-signing.keychain-db"
          password="$(uuidgen)"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - name: Build (signed when MACOS_SIGN_IDENTITY / MACOS_INSTALLER_IDENTITY are set)
        run: bash macos/build.sh
      - name: Notarize and staple (when Apple credentials are set)
        if: env.MACOS_INSTALLER_IDENTITY != ''
        run: bash macos/notarize.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: dist/YiIME-*-macos-beta.pkg
