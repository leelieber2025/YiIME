name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msrv-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
      - run: cargo +1.85.0 test -p yiime-core -p yiime-cli -p yiime-ffi --locked
  msrv-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - run: cargo +1.88.0 build -p yiime-app -p yiime-tsf --locked
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: rustfmt
      - run: cargo fmt --all --check
  release-gnu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          targets: x86_64-pc-windows-gnu,i686-pc-windows-gnu
          components: clippy
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 gcc-mingw-w64-i686-posix binutils-mingw-w64-i686
      # Windows-only code (YiIME.exe, the TSF DLL) only compiles for a Windows target.
      - name: Clippy (Windows target)
        run: cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-gnu -- -D warnings
      # The 32-bit TSF DLL (for 32-bit applications).
      - name: Clippy (32-bit TSF DLL)
        env:
          CARGO_TARGET_I686_PC_WINDOWS_GNU_LINKER: i686-w64-mingw32-gcc-posix
        run: cargo clippy -p yiime-tsf --all-targets --locked --target i686-pc-windows-gnu -- -D warnings
      # Source hash must match; EXE/DLL are not yet byte-reproducible, so only warn.
      - name: Build actual release target twice
        run: |
          bash windows/build.sh
          cp dist/BUILDINFO.txt /tmp/first-buildinfo.txt
          cargo clean --target x86_64-pc-windows-gnu
          cargo clean --target i686-pc-windows-gnu
          bash windows/build.sh
          python3 - <<'PY'
          from pathlib import Path
          first = dict(line.split(': ', 1) for line in Path('/tmp/first-buildinfo.txt').read_text().splitlines() if ': ' in line)
          second = dict(line.split(': ', 1) for line in Path('dist/BUILDINFO.txt').read_text().splitlines() if ': ' in line)
          assert first['Source SHA-256'] == second['Source SHA-256'], 'Source SHA-256 changed across clean builds'
          for key in ('EXE SHA-256', 'DLL SHA-256', 'x86 DLL SHA-256'):
              if first[key] != second[key]:
                  print(f'::warning::{key} differs across clean builds (not yet reproducible)')
          PY
      - name: VERSIONINFO matches Cargo.toml
        run: |
          # VERSIONINFO is numeric: a release candidate (0.2.0-rc.1) carries 0.2.0.
          version="$(tools/version.sh)"; version="${version%%-*}"
          for file in dist/YiIME.exe dist/yiime_tsf.dll dist/yiime_tsf_x86.dll; do
              strings -el "$file" | grep -qx "$version" || { echo "$file 缺少版本 $version" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: windows-gnu
          path: |
            dist/*.zip
            dist/BUILDINFO.txt
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
      - name: Tests
        run: cargo test --workspace
      # The release package is cross-built with MinGW in release-gnu; here build natively to test registration.
      - name: Build (native MSVC)
        run: |
          cargo build --release -p yiime-app
          cargo build --release -p yiime-tsf
      # Headless smoke test of the real input box: scripted keys go through the Win32 key handler
      # (yiime_core::classify_char + the edit control) and the draft is checked. No tray icon, no
      # registry writes; the process exits non-zero (and prints to stderr) on a mismatch.
      - name: Input box smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'target\release\windows_gui.exe').Path
          $result = Start-Process $exe -ArgumentList '--self-test' -Wait -PassThru -RedirectStandardError self-test.log
          Get-Content self-test.log
          if ($result.ExitCode -ne 0) { throw "self-test failed: $($result.ExitCode)" }
      - name: Register and unregister TSF
        shell: pwsh
        run: |
          $dll = (Resolve-Path 'target\release\yiime_tsf.dll').Path
          $regsvr32 = Join-Path $env:WINDIR 'System32\regsvr32.exe'
          $result = Start-Process $regsvr32 -ArgumentList @('/s', "`"$dll`"") -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "register failed: $($result.ExitCode)" }
          try {
            $key = 'Registry::HKEY_CLASSES_ROOT\CLSID\{A72091C2-7459-4C47-85F4-4626AE42A6C8}\InprocServer32'
            if (-not (Test-Path $key)) { throw 'TSF CLSID missing' }
            if ((Get-Item $key).GetValue('') -ne $dll) { throw 'wrong TSF DLL path' }
          } finally {
            $result = Start-Process $regsvr32 -ArgumentList @('/u', '/s', "`"$dll`"") -Wait -PassThru
            if ($result.ExitCode -ne 0) { throw "unregister failed: $($result.ExitCode)" }
            $result = Start-Process $regsvr32 -ArgumentList @('/u', '/s', "`"$dll`"") -Wait -PassThru
            if ($result.ExitCode -ne 0) { Write-Output "::warning::second unregister returned $($result.ExitCode)" }
          }
      # 32-bit DLL next to the 64-bit one, as the installer registers them (SysWOW64 regsvr32 writes
      # WOW6432Node; the TIP profile is shared), and both unregistered again.
      - name: Register and unregister the 32-bit TSF DLL
        shell: pwsh
        run: |
          rustup target add i686-pc-windows-msvc
          cargo build --release -p yiime-tsf --target i686-pc-windows-msvc
          $dll = (Resolve-Path 'target\release\yiime_tsf.dll').Path
          $dll32 = (Resolve-Path 'target\i686-pc-windows-msvc\release\yiime_tsf.dll').Path
          $regsvr32 = Join-Path $env:WINDIR 'System32\regsvr32.exe'
          $regsvr32x86 = Join-Path $env:WINDIR 'SysWOW64\regsvr32.exe'
          foreach ($pair in @(@($regsvr32, $dll), @($regsvr32x86, $dll32))) {
            $result = Start-Process $pair[0] -ArgumentList @('/s', "`"$($pair[1])`"") -Wait -PassThru
            if ($result.ExitCode -ne 0) { throw "register failed: $($pair[1]) $($result.ExitCode)" }
          }
          try {
            $key = 'Registry::HKEY_CLASSES_ROOT\CLSID\{A72091C2-7459-4C47-85F4-4626AE42A6C8}\InprocServer32'
            $key32 = 'Registry::HKEY_CLASSES_ROOT\WOW6432Node\CLSID\{A72091C2-7459-4C47-85F4-4626AE42A6C8}\InprocServer32'
            if ((Get-Item $key).GetValue('') -ne $dll) { throw 'wrong 64-bit TSF DLL path' }
            if ((Get-Item $key32).GetValue('') -ne $dll32) { throw 'wrong 32-bit TSF DLL path' }
          } finally {
            foreach ($pair in @(@($regsvr32x86, $dll32), @($regsvr32, $dll))) {
              $result = Start-Process $pair[0] -ArgumentList @('/u', '/s', "`"$($pair[1])`"") -Wait -PassThru
              if ($result.ExitCode -ne 0) { throw "unregister failed: $($pair[1]) $($result.ExitCode)" }
            }
          }
      - name: Installer and uninstaller PowerShell unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:YIIME_PS_TEST = '1'
          $tmp = Join-Path ([IO.Path]::GetTempPath()) ("yiime-ps-test-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          try {
            . .\windows\Install-YiIME.ps1
            # 1. Directory boundary checks
            $dir = Join-Path $tmp 'YiIME'
            if (-not (Test-PathUnderDirectory (Join-Path $dir 'v1\YiIME.exe') $dir)) { throw 'expected match inside directory' }
            if (Test-PathUnderDirectory (Join-Path $tmp 'YiIME2\YiIME.exe') $dir) { throw 'must not match sibling prefix YiIME2' }
            if (Test-PathUnderDirectory (Join-Path $tmp 'YiIME-old\YiIME.exe') $dir) { throw 'must not match sibling prefix YiIME-old' }

            # 2. SHA256 copy verification
            $src = Join-Path $tmp 'src.bin'
            $dst = Join-Path $tmp 'dst.bin'
            [IO.File]::WriteAllBytes($src, [byte[]](1, 2, 3, 4, 5))
            [IO.File]::WriteAllBytes($dst, [byte[]](9, 9))
            Copy-VerifiedFile $src $dst
            if ((Get-FileHash $dst -Algorithm SHA256).Hash -ne (Get-FileHash $src -Algorithm SHA256).Hash) {
              throw 'corrupted destination was not replaced'
            }
            Copy-VerifiedFile $src $dst

            # 3. Registration rollback for both arches + CurrentDir
            $old64 = Join-Path $tmp 'old64.dll'
            $old32 = Join-Path $tmp 'old32.dll'
            $new64 = Join-Path $tmp 'new64.dll'
            $new32 = Join-Path $tmp 'new32.dll'
            foreach ($f in @($old64, $old32, $new64, $new32)) { [IO.File]::WriteAllBytes($f, [byte[]](0)) }

            $script:reg64 = $old64
            $script:reg32 = $old32
            $script:curDir = 'C:\OldDir'
            $threw = $false
            try {
              Invoke-DllRegistration -Dll $new64 -Dll32 $new32 -OldDll $old64 -OldDll32 $old32 -Destination 'C:\NewDir' `
                -RunRegsvr64 { param($a) if ($a[0] -eq '/u') { $script:reg64 = $null } else { $script:reg64 = $a[1].Trim('"') }; 0 } `
                -RunRegsvr32 { param($a) if ($a[0] -eq '/u') { $script:reg32 = $null; 0 } elseif ($a[1].Trim('"') -eq $new32) { 5 } else { $script:reg32 = $a[1].Trim('"'); 0 } } `
                -SetCurrentDir { param($d) $script:curDir = $d } `
                -RestoreCurrentDir { $script:curDir = 'C:\OldDir' }
            } catch { $threw = $true }
            if (-not $threw) { throw 'expected x86 registration failure' }
            if ($script:reg64 -ne $old64 -or $script:reg32 -ne $old32 -or $script:curDir -ne 'C:\OldDir') {
              throw "rollback failed after x86 failure: 64=$($script:reg64) 32=$($script:reg32) dir=$($script:curDir)"
            }

            $threw = $false
            try {
              Invoke-DllRegistration -Dll $new64 -Dll32 $new32 -OldDll $old64 -OldDll32 $old32 -Destination 'C:\NewDir' `
                -RunRegsvr64 { param($a) if ($a[0] -eq '/u') { $script:reg64 = $null } else { $script:reg64 = $a[1].Trim('"') }; 0 } `
                -RunRegsvr32 { param($a) if ($a[0] -eq '/u') { $script:reg32 = $null } else { $script:reg32 = $a[1].Trim('"') }; 0 } `
                -SetCurrentDir { param($d) throw 'write failed' } `
                -RestoreCurrentDir { $script:curDir = 'C:\OldDir' }
            } catch { $threw = $true }
            if (-not $threw) { throw 'expected CurrentDir failure' }
            if ($script:reg64 -ne $old64 -or $script:reg32 -ne $old32 -or $script:curDir -ne 'C:\OldDir') {
              throw "rollback failed after CurrentDir failure: 64=$($script:reg64) 32=$($script:reg32) dir=$($script:curDir)"
            }

            # 4. Uninstaller boundary check + x86/x64 unregister exit codes
            . .\windows\Uninstall-YiIME.ps1
            if (Test-PathUnderDirectory (Join-Path $tmp 'YiIME2\YiIME.exe') $dir) { throw 'uninstaller must not match YiIME2' }
            $threw = $false
            $called64 = $false
            try {
              Invoke-DllUnregistration -Dll $old64 -Dll32 $old32 `
                -RunRegsvr64 { param($a) $script:called64 = $true; 0 } `
                -RunRegsvr32 { param($a) 5 }
            } catch { $threw = $true }
            if (-not $threw -or $called64) { throw 'expected x86 unregister failure to stop immediately' }
            $threw = $false
            try {
              Invoke-DllUnregistration -Dll $old64 -Dll32 $old32 `
                -RunRegsvr64 { param($a) 3 } `
                -RunRegsvr32 { param($a) 0 }
            } catch { $threw = $true }
            if (-not $threw) { throw 'expected x64 unregister failure to throw' }
            Invoke-DllUnregistration -Dll $old64 -Dll32 $old32 -RunRegsvr64 { param($a) 0 } -RunRegsvr32 { param($a) 0 }
          } finally {
            Remove-Item Env:YIIME_PS_TEST -ErrorAction SilentlyContinue
            Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
          }

  linux-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: clippy
      # Warnings fail the build; this is what enforces clippy::unwrap_used outside tests.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests (core, CLI, FFI)
        run: cargo test -p yiime-core -p yiime-cli -p yiime-ffi
      - name: Build CLI
        run: cargo build --release -p yiime-cli
      - name: Smoke test
        run: |
          ./target/release/yiime query zhongguo --pages 1 | tee /tmp/query.txt
          grep -q 中国 /tmp/query.txt
      - name: Package tar.gz
        run: bash tools/package-linux.sh ${{ matrix.arch }}
      - name: Package .deb
        run: |
          cargo install cargo-deb --version 2.9.3 --locked
          cargo deb -p yiime-cli --no-build --output dist/
          sudo dpkg -i dist/*.deb
          yiime query zhongguo --pages 1 | grep -q 中国
          dpkg -L yiime | grep -q /usr/share/yiime/YiIME-words.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
