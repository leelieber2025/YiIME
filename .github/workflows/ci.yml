name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msrv-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
      - run: cargo +1.85.0 test -p yiime-core -p yiime-cli -p yiime-ffi --locked
  msrv-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - run: cargo +1.88.0 build -p yiime-app -p yiime-tsf --locked
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: rustfmt
      - run: cargo fmt --all --check
  release-gnu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          targets: x86_64-pc-windows-gnu
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64
      # Source hash must match; EXE/DLL are not yet byte-reproducible, so only warn.
      - name: Build actual release target twice
        run: |
          bash windows/build.sh
          cp dist/BUILDINFO.txt /tmp/first-buildinfo.txt
          cargo clean --target x86_64-pc-windows-gnu
          bash windows/build.sh
          python3 - <<'PY'
          from pathlib import Path
          first = dict(line.split(': ', 1) for line in Path('/tmp/first-buildinfo.txt').read_text().splitlines() if ': ' in line)
          second = dict(line.split(': ', 1) for line in Path('dist/BUILDINFO.txt').read_text().splitlines() if ': ' in line)
          assert first['Source SHA-256'] == second['Source SHA-256'], 'Source SHA-256 changed across clean builds'
          for key in ('EXE SHA-256', 'DLL SHA-256'):
              if first[key] != second[key]:
                  print(f'::warning::{key} differs across clean builds (not yet reproducible)')
          PY
      - name: VERSIONINFO matches Cargo.toml
        run: |
          # VERSIONINFO is numeric: a release candidate (0.2.0-rc.1) carries 0.2.0.
          version="$(tools/version.sh)"; version="${version%%-*}"
          for file in dist/YiIME.exe dist/yiime_tsf.dll; do
              strings -el "$file" | grep -qx "$version" || { echo "$file 缺少版本 $version" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: windows-gnu
          path: |
            dist/*.zip
            dist/BUILDINFO.txt
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
      - name: Tests
        run: cargo test --workspace
      # The release package is cross-built with MinGW in release-gnu; here build natively to test registration.
      - name: Build (native MSVC)
        run: |
          cargo build --release -p yiime-app
          cargo build --release -p yiime-tsf
      # Headless smoke test of the real input box: scripted keys go through the Win32 key handler
      # (yiime_core::classify_char + the edit control) and the draft is checked. No tray icon, no
      # registry writes; the process exits non-zero (and prints to stderr) on a mismatch.
      - name: Input box smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'target\release\windows_gui.exe').Path
          $result = Start-Process $exe -ArgumentList '--self-test' -Wait -PassThru -RedirectStandardError self-test.log
          Get-Content self-test.log
          if ($result.ExitCode -ne 0) { throw "self-test failed: $($result.ExitCode)" }
      - name: Register and unregister TSF
        shell: pwsh
        run: |
          $dll = (Resolve-Path 'target\release\yiime_tsf.dll').Path
          $regsvr32 = Join-Path $env:WINDIR 'System32\regsvr32.exe'
          $result = Start-Process $regsvr32 -ArgumentList @('/s', "`"$dll`"") -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "register failed: $($result.ExitCode)" }
          try {
            $key = 'Registry::HKEY_CLASSES_ROOT\CLSID\{A72091C2-7459-4C47-85F4-4626AE42A6C8}\InprocServer32'
            if (-not (Test-Path $key)) { throw 'TSF CLSID missing' }
            if ((Get-Item $key).GetValue('') -ne $dll) { throw 'wrong TSF DLL path' }
          } finally {
            $result = Start-Process $regsvr32 -ArgumentList @('/u', '/s', "`"$dll`"") -Wait -PassThru
            if ($result.ExitCode -ne 0) { throw "unregister failed: $($result.ExitCode)" }
            $result = Start-Process $regsvr32 -ArgumentList @('/u', '/s', "`"$dll`"") -Wait -PassThru
            if ($result.ExitCode -ne 0) { Write-Output "::warning::second unregister returned $($result.ExitCode)" }
          }

  linux-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
      - name: Tests (core, CLI, FFI)
        run: cargo test -p yiime-core -p yiime-cli -p yiime-ffi
      - name: Build CLI
        run: cargo build --release -p yiime-cli
      - name: Smoke test
        run: |
          ./target/release/yiime query zhongguo --pages 1 | tee /tmp/query.txt
          grep -q 中国 /tmp/query.txt
      - name: Package tar.gz
        run: bash tools/package-linux.sh ${{ matrix.arch }}
      - name: Package .deb
        run: |
          cargo install cargo-deb --version 2.9.3 --locked
          cargo deb -p yiime-cli --no-build --output dist/
          sudo dpkg -i dist/*.deb
          yiime query zhongguo --pages 1 | grep -q 中国
          dpkg -L yiime | grep -q /usr/share/yiime/YiIME-words.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
