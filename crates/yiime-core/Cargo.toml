[package]
name = "yiime-core"
version.workspace = true
license = "GPL-3.0-only"
edition = "2024"
rust-version = "1.85"
description = "YiIME core: wubi/pinyin lookup, candidate engine, dictionaries, drafts, translation client"

[features]
default = ["engine", "bundled", "translate"]
# Input engine: dictionaries and indexes, candidates, learning, draft, Simplified→Traditional
# (OpenCC tables, about 1 MB).
engine = []
# Compile the Wubi/pinyin/supplementary dictionaries into the binary (MixedInput::bundled).
bundled = ["engine"]
# OpenAI-compatible and Google translation client (network). Not needed by the TSF DLL.
translate = ["dep:ureq", "dep:url"]

[dependencies]
serde_json = "1"
ureq = { version = "2", features = ["json", "proxy-from-env"], optional = true }
url = { version = "2", optional = true }

[lints.clippy]
# Errors are propagated or defaulted; tests may unwrap (clippy.toml).
unwrap_used = "warn"
