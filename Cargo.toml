[package]
name = "yiime-app"
version.workspace = true
license = "GPL-3.0-only"
edition = "2024"
rust-version = "1.88"
default-run = "yiime-app"

[workspace.package]
version = "0.1.5"

[workspace]
members = ["crates/yiime-core", "crates/yiime-cli", "crates/yiime-ffi", "windows/tsf"]
default-members = [".", "crates/yiime-core", "crates/yiime-cli"]

[dependencies]
yiime-core = { path = "crates/yiime-core" }
serde_json = "1"

[build-dependencies]
embed-resource = "3"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Ime", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_Memory", "Win32_System_SystemInformation"] }
