[package]
name = "yiime-tsf"
version.workspace = true
license = "GPL-3.0-only"
edition = "2024"
rust-version = "1.88"

[lib]
name = "yiime_tsf"
crate-type = ["cdylib"]

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
# Platform-independent core: setting names and defaults, shortcut parsing, punctuation mapping (no
# translation client or dictionaries).
yiime-core = { path = "../../crates/yiime-core", default-features = false }
windows-core = "0.62.2"
windows-registry = "0.6"
windows = { version = "0.62.2", features = [
  "Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_LibraryLoader",
  "Win32_System_SystemServices", "Win32_UI_TextServices",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"
] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_DataExchange",
  "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Diagnostics_Debug",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security",
  "Win32_System_RemoteDesktop"
] }

[lints.clippy]
# Errors are propagated or defaulted; tests may unwrap (clippy.toml).
unwrap_used = "warn"
